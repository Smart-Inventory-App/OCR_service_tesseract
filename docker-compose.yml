services:

  tesseract:
    build: .
    container_name: tpp_ocr_tesseract
    ports:
      - "8005:8005"
    env_file:
      - .env
    networks:
      - tpp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/engine/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  tpp-net:
    external: true
    name: tpp-net
